name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pyqt6 python3-pip xvfb

      - name: Lint
        run: |
          pipx install ruff
          ruff check .
          ruff format --check .

      - name: Compile
        run: python3 -m compileall -q src tests

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s tests -t . -v

      - name: Translation catalogs are in sync
        run: |
          ./scripts/update-translations.sh
          git diff --exit-code i18n/
